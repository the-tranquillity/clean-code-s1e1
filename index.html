<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <meta
      name="description"
      content="Small single-page ToDo-list based on the Eisenhower Matrix."
    >
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8"
    >
  </head>
  <body>
    <header class="aaa">
      <h1>Todo App</h1>
      <img src="./eisenhower-matrix.jpg">
      <a
        class="more_inf"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        target="_blank"
      >
        Want more details?
      </a>
    </header>
    <main class="centered-main-page-element">
      <section id="top-section-for-adding-element-to-list">
        <h2>Add Item</h2>
        <div class="task-row-wrapper">
          <label for="new-task">New task:</label>
          <input
            id="new-task"
            class="task"
            type="text"
            placeholder="Type task name"
          >
          <button type="button">Add</button>
        </div>
      </section>
      <section>
        <h2>Todo</h2>
        <ul id="incomplete-tasks">
          <li>
            <input type="checkbox">
            <label class="task">Pay Bills</label>
            <input type="text" class="task">
            <button class="edit" type="button">Edit</button>
            <button class="delete" type="button">
              <img src="./remove.svg">
            </button>
          </li>
          <li class="edit-mode">
            <input type="checkbox">
            <label class="task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task">
            <button class="edit" type="button">Save</button>
            <button class="delete" type="button">
              <img src="./remove.svg">
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2>Completed</h2>
        <ul id="completed-tasks">
          <li>
            <input type="checkbox" checked>
            <label class="task">See the Doctor</label>
            <input type="text" class="task">
            <button class="edit" type="button">Edit</button>
            <button class="delete" type="button">
              <img src="./remove.svg">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>

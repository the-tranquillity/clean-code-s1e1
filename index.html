<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <meta
      name="description"
      content="Small single-page ToDo-list based on the Eisenhower Matrix."
    >
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8"
    >
  </head>
  <body>
    <header class="header">
      <h1>Todo App</h1>
      <img class="header__image" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
      <a
        class="header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        target="_blank"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <section>
        <h2 class="heading">Add Item</h2>
        <div class="add-task">
          <label class="add-task__label" for="new-task">New task:</label>
          <input
            id="new-task"
            class="add-task__input"
            type="text"
            placeholder="Type task name"
          >
          <button class="add-task__button" type="button">Add</button>
        </div>
      </section>
      <section>
        <h2 class="heading">Todo</h2>
        <ul class="task-list task-list--incomplete">
          <li class="task-list__item task-item">
            <input class="task-item__checkbox" type="checkbox">
            <label class="task-item__label">Pay Bills</label>
            <input class="task-item__input" type="text">
            <button class="task-item__edit" type="button">Edit</button>
            <button class="task-item__delete" type="button">
              <img src="./remove.svg" alt="Remove task">
            </button>
          </li>
          <li class="task-list__item task-item task-list__item--edit">
            <input class="task-item__checkbox" type="checkbox">
            <label class="task-item__label">Go Shopping</label>
            <input class="task-item__input" type="text" value="Go Shopping">
            <button class="task-item__edit" type="button">Save</button>
            <button class="task-item__delete" type="button">
              <img src="./remove.svg" alt="Remove task">
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2 class="heading">Completed</h2>
        <ul class="task-list task-list--completed">
          <li class="task-list__item task-item">
            <input class="task-item__checkbox" type="checkbox" checked>
            <label class="task-item__label">See the Doctor</label>
            <input class="task-item__input" type="text">
            <button class="task-item__edit" type="button">Edit</button>
            <button class="task-item__delete" type="button">
              <img src="./remove.svg" alt="Remove task">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
